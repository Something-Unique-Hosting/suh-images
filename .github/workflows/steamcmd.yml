name: Build steamcmd images

on:
  push:
    branches: [main]
    paths:
      - "steamcmd/**"
      - ".github/workflows/steamcmd.yml"
  schedule:
    # weekly rebuild for Debian security updates; tool versions are pinned
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/steamcmd

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [proton]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: steamcmd/${{ matrix.variant }}
          platforms: linux/amd64
          pull: true
          load: true
          tags: ${{ env.IMAGE }}:${{ matrix.variant }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=SUH steamcmd ${{ matrix.variant }} image

      # Guard against the Enshrouded break: Proton's lsteamclient must expose
      # the Steam interfaces current games ask for.
      - name: Check lsteamclient interfaces
        if: matrix.variant == 'proton'
        run: |
          docker run --rm --entrypoint sh "$IMAGE:${{ matrix.variant }}" -c \
            'cat /usr/local/bin/ge-proton-version; grep -aoE "SteamUtils0[0-9]+" /usr/local/bin/files/lib/wine/x86_64-unix/lsteamclient.so | sort -u' \
            | tee /tmp/ifaces
          grep -q SteamUtils011 /tmp/ifaces

      - name: Push
        run: docker push "$IMAGE:${{ matrix.variant }}"
