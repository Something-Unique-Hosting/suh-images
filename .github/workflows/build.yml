name: Build game images

on:
  push:
    branches: [main]
    paths:
      - "games/**"
      - ".github/workflows/build.yml"
  schedule:
    # weekly rebuild to pick up upstream base image changes
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/games

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        game: [valheim]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: games/${{ matrix.game }}
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ env.IMAGE }}:${{ matrix.game }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=SUH ${{ matrix.game }} game image
