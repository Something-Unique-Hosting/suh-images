name: Bump GE-Proton

on:
  schedule:
    - cron: "7 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check for a new GE-Proton release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          f=steamcmd/proton/Dockerfile
          cur=$(sed -nE 's/^ARG GE_PROTON_VERSION=(.*)$/\1/p' "$f")
          new=$(gh api repos/GloriousEggroll/proton-ge-custom/releases/latest -q .tag_name)
          echo "current=$cur latest=$new"
          if [ "$cur" = "$new" ] || [ -z "$new" ]; then exit 0; fi
          sha=$(curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors "https://github.com/GloriousEggroll/proton-ge-custom/releases/download/$new/$new-x86_64.sha512sum" | awk '{print $1}')
          [ ${#sha} -eq 128 ] || { echo "no x86_64 sha512sum for $new"; exit 1; }
          sed -i -E "s/^ARG GE_PROTON_VERSION=.*/ARG GE_PROTON_VERSION=$new/; s/^ARG GE_PROTON_SHA512=.*/ARG GE_PROTON_SHA512=$sha/" "$f"
          echo "new=$new" >> "$GITHUB_OUTPUT"

      - name: Open PR
        if: steps.check.outputs.new != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW: ${{ steps.check.outputs.new }}
        run: |
          branch="bump/$NEW"
          title="steamcmd/proton: bump to $NEW"
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null; then
            echo "branch $branch exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b "$branch"
            git commit -am "$title"
            git push origin "$branch"
          fi
          # A pushed branch does not prove the PR was opened; check for it, including closed ones.
          pr=$(gh pr list --head "$branch" --state all --json number -q '.[0].number')
          if [ -n "$pr" ]; then echo "PR #$pr exists"; exit 0; fi
          gh pr create --head "$branch" --title "$title" \
            --body "Release notes: https://github.com/GloriousEggroll/proton-ge-custom/releases/tag/$NEW. Test on one Proton server (e.g. Enshrouded) after merge."
